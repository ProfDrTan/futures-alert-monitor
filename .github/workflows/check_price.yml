name: Check ES/NQ Price

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a one-off test Telegram message (bypasses price logic)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check price against levels (ES + NQ)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ALERT: ${{ inputs.test_alert == true && '1' || '0' }}
        run: python check_price.py
      - name: Commit state files
        run: |
          git config user.name "futures-alert-bot"
          git config user.email "actions@github.com"
          {
            echo "--- git status ---"
            git status
            echo "--- git add ---"
            git add last_alert_state_*.json 2>&1 || true
            echo "--- git diff --staged ---"
            git diff --staged --stat || true
          } > /tmp/commit_debug.log 2>&1
          git diff --quiet && git diff --staged --quiet || git commit -m "Update alert state" >> /tmp/commit_debug.log 2>&1
          git push >> /tmp/commit_debug.log 2>&1
          echo "exit_code_of_push=$?" >> /tmp/commit_debug.log
          cp /tmp/commit_debug.log commit_debug.log
          git add commit_debug.log
          git commit -m "debug log" --allow-empty
          git push
