name: Check ES/NQ Price

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a one-off test Telegram message (bypasses price logic)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check price against levels (ES + NQ)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ALERT: ${{ inputs.test_alert == true && '1' || '0' }}
        run: python check_price.py
      - name: Commit state files (debug mode)
        run: |
          set +e
          git config user.name "futures-alert-bot"
          git config user.email "actions@github.com"
          {
            echo "--- git status ---"
            git status
            echo "--- git add ---"
            git add last_alert_state_*.json
            echo "add_exit=$?"
            echo "--- git diff --staged --stat ---"
            git diff --staged --stat
          } > commit_debug.log 2>&1

          git diff --quiet
          unstaged=$?
          git diff --staged --quiet
          staged=$?
          echo "unstaged_diff_exit=$unstaged staged_diff_exit=$staged" >> commit_debug.log

          if [ "$unstaged" -ne 0 ] || [ "$staged" -ne 0 ]; then
            git commit -m "Update alert state" >> commit_debug.log 2>&1
            echo "commit_exit=$?" >> commit_debug.log
          else
            echo "no changes, skip commit" >> commit_debug.log
          fi

          git push >> commit_debug.log 2>&1
          echo "push_exit=$?" >> commit_debug.log

          git add commit_debug.log
          git commit -m "debug log" --allow-empty >> commit_debug.log 2>&1
          git push >> commit_debug.log 2>&1
          exit 0
