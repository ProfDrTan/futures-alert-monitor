name: Check ES/NQ Price

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check price against levels (ES + NQ)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_price.py
      - name: Commit state files
        run: |
          git config user.name "futures-alert-bot"
          git config user.email "actions@github.com"
          if ls last_alert_state_*.json >/dev/null 2>&1; then
            git add last_alert_state_*.json
            git diff --quiet && git diff --staged --quiet || git commit -m "Update alert state"
            git push
          else
            echo "No state files yet (no alert has fired), nothing to commit."
          fi
