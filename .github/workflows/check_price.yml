name: Check MES Price

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check price against levels
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_mes_price.py
      - name: Commit state file
        run: |
          git config user.name "mes-alert-bot"
          git config user.email "actions@github.com"
          if [ -f last_alert_state.json ]; then
            git add last_alert_state.json
            git diff --quiet && git diff --staged --quiet || git commit -m "Update alert state"
            git push
          else
            echo "No state file yet (no alert has fired), nothing to commit."
          fi
