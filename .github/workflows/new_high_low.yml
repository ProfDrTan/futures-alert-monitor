name: New High/Low Alert (ES/NQ/RTY/YM/GC/BTC)

on:
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  repository_dispatch:
    types: [new_high_low_check]
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a one-off test Telegram message (bypasses price logic)'
        required: false
        default: 'false'
        type: boolean
      send_snapshot:
        description: 'Send current high/low/VWAP for all symbols right now, regardless of new-extreme status'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install matplotlib requests
      - name: Check for new session high/low (ES, NQ, RTY, YM, GC, BTC)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ALERT: ${{ inputs.test_alert == true && '1' || '0' }}
          SEND_SNAPSHOT: ${{ inputs.send_snapshot == true && '1' || '0' }}
        run: python new_high_low_check.py
      - name: Commit session state files
        run: |
          git config user.name "futures-alert-bot"
          git config user.email "actions@github.com"
          shopt -s nullglob
          files=(session_state_*.json)
          if [ ${#files[@]} -gt 0 ]; then
            git add "${files[@]}"
            git diff --quiet && git diff --staged --quiet || git commit -m "Update new-high/new-low session state"
            git push
          else
            echo "No session_state_*.json files yet (likely a test-only run) -- nothing to commit."
          fi
